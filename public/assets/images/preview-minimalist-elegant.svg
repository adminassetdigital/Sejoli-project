<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" width="360" height="610">
  <defs>
    <linearGradient id="champagneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f2ed"/>
      <stop offset="40%" stop-color="#d7cbb6"/>
      <stop offset="80%" stop-color="#ae9671"/>
      <stop offset="100%" stop-color="#d7cbb6"/>
    </linearGradient>
    <radialGradient id="darkBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#26231f"/>
      <stop offset="50%" stop-color="#191714"/>
      <stop offset="100%" stop-color="#0f0e0c"/>
    </radialGradient>
    <filter id="champagneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#d7cbb6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="360" height="610" fill="url(#darkBg)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="40" cy="80" r="120" fill="#ae9671" opacity="0.08" filter="blur(30px)"/>
  <circle cx="320" cy="500" r="140" fill="#d7cbb6" opacity="0.06" filter="blur(40px)"/>

  <!-- Thin Minimalist Editorial Border -->
  <rect x="18" y="18" width="324" height="574" rx="16" fill="none" stroke="#d7cbb6" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Content Container -->
  <g transform="translate(30, 45)">
    <!-- Subtitle -->
    <text x="150" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" fill="#d7cbb6" letter-spacing="4" text-transform="uppercase">THE WEDDING CELEBRATION</text>

    <!-- Couple Avatar Photo Ring -->
    <g transform="translate(150, 115)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="#d7cbb6" stroke-width="0.75" opacity="0.3"/>
      <circle cx="0" cy="0" r="46" fill="#1c1a17" stroke="url(#champagneGrad)" stroke-width="1.5" filter="url(#champagneGlow)"/>
      <!-- Stylized Silhouette -->
      <circle cx="0" cy="-6" r="14" fill="#d7cbb6" opacity="0.9"/>
      <path d="M-22,28 C-22,6 22,6 22,28 Z" fill="#ae9671" opacity="0.7"/>
    </g>

    <!-- Couple Names (Editorial Serif) -->
    <text x="150" y="215" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="30" font-style="italic" font-weight="400" fill="#faf9f6">
      Sorensen <tspan font-style="normal" font-size="22" fill="#d7cbb6">&amp;</tspan> Freya
    </text>

    <!-- Date line -->
    <text x="150" y="244" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="400" fill="#c2af91" letter-spacing="3">SABTU, 24 OKTOBER 2026</text>
    <line x1="80" y1="260" x2="220" y2="260" stroke="#d7cbb6" stroke-width="0.5" stroke-opacity="0.3"/>

    <!-- Inset Guest Box (Glass Card) -->
    <g transform="translate(20, 280)">
      <rect width="260" height="90" rx="14" fill="#141210" fill-opacity="0.8" stroke="#d7cbb6" stroke-width="0.8" stroke-opacity="0.25"/>
      <text x="130" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#aba293" letter-spacing="2">KEPADA YTH. BAPAK/IBU/SAUDARA/I:</text>
      <text x="130" y="52" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" fill="#faf9f6">Tamu Undangan</text>
      <text x="130" y="72" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-style="italic" fill="#898072">Tanpa mengurangi rasa hormat, kami mengundang Anda</text>
    </g>

    <!-- Champagne Capsule Button -->
    <g transform="translate(50, 405)">
      <rect width="200" height="42" rx="21" fill="url(#champagneGrad)" filter="url(#champagneGlow)"/>
      <text x="100" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#141210" letter-spacing="2">BUKA UNDANGAN</text>
    </g>
  </g>
</svg>
