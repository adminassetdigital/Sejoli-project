<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" width="360" height="610">
  <defs>
    <linearGradient id="amberGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4BF72"/>
      <stop offset="35%" stop-color="#FFF0D6"/>
      <stop offset="70%" stop-color="#D9A143"/>
      <stop offset="100%" stop-color="#C78326"/>
    </linearGradient>
    <radialGradient id="sunsetBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="45%" stop-color="#F4ECE1"/>
      <stop offset="80%" stop-color="#EEDAA8"/>
      <stop offset="100%" stop-color="#C78326"/>
    </radialGradient>
    <radialGradient id="sunflareAura" cx="50%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#FFD8B8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E4BF72" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FAF5EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="sunsetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#C78326" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="360" height="610" fill="url(#sunsetBg)"/>
  <circle cx="180" cy="180" r="160" fill="url(#sunflareAura)"/>

  <!-- Subtle Ambient Pattern Dots -->
  <g fill="#D9A143" opacity="0.12">
    <circle cx="20" cy="20" r="1.5"/><circle cx="60" cy="20" r="1.5"/><circle cx="100" cy="20" r="1.5"/><circle cx="140" cy="20" r="1.5"/><circle cx="180" cy="20" r="1.5"/><circle cx="220" cy="20" r="1.5"/><circle cx="260" cy="20" r="1.5"/><circle cx="300" cy="20" r="1.5"/><circle cx="340" cy="20" r="1.5"/>
    <circle cx="20" cy="60" r="1.5"/><circle cx="60" cy="60" r="1.5"/><circle cx="100" cy="60" r="1.5"/><circle cx="140" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/><circle cx="220" cy="60" r="1.5"/><circle cx="260" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="340" cy="60" r="1.5"/>
    <circle cx="20" cy="100" r="1.5"/><circle cx="60" cy="100" r="1.5"/><circle cx="100" cy="100" r="1.5"/><circle cx="140" cy="100" r="1.5"/><circle cx="180" cy="100" r="1.5"/><circle cx="220" cy="100" r="1.5"/><circle cx="260" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="340" cy="100" r="1.5"/>
  </g>

  <!-- Main Card Container -->
  <g transform="translate(24, 40)">
    <!-- Header -->
    <text x="156" y="30" text-anchor="middle" font-family="'Raleway', sans-serif" font-size="9" font-weight="700" fill="#7E4515" letter-spacing="3.5">WALIMATUL 'URSY</text>

    <!-- Couple Concentric Ring -->
    <g transform="translate(156, 115)">
      <!-- Outer Concentric Rotating Ring -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#D9A143" stroke-width="0.8" opacity="0.4"/>
      <!-- Dashed Middle Ring -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="url(#amberGoldGrad)" stroke-width="1.8" stroke-dasharray="6 4"/>
      <!-- Inner Photo Frame -->
      <circle cx="0" cy="0" r="40" fill="#FAF5EE" stroke="#D9A143" stroke-width="2" filter="url(#sunsetGlow)"/>
      <path d="M-15,10 C-15,-10 15,-10 15,10 Z" fill="#C78326" opacity="0.85"/>
      <circle cx="0" cy="-6" r="10" fill="#E4BF72"/>
    </g>

    <!-- Couple Names & Script Ampersand -->
    <text x="156" y="215" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="34" font-weight="700" fill="#7E4515">
      Soren <tspan font-family="'Playfair Display', serif" font-size="22" fill="#C78326">&amp;</tspan> Freya
    </text>

    <!-- Subtitle Date -->
    <text x="156" y="240" text-anchor="middle" font-family="'Raleway', sans-serif" font-size="8.5" font-weight="600" fill="#8C5628" letter-spacing="2">SABTU, 24 OKTOBER 2026</text>

    <!-- Recipient Box -->
    <g transform="translate(26, 275)">
      <rect width="260" height="95" rx="14" fill="#FAF5EE" fill-opacity="0.9" stroke="url(#amberGoldGrad)" stroke-width="1.2" filter="url(#sunsetGlow)"/>
      <!-- Corner Accents -->
      <path d="M 10 18 L 10 10 L 18 10" fill="none" stroke="#D9A143" stroke-width="1.2"/>
      <path d="M 250 18 L 250 10 L 242 10" fill="none" stroke="#D9A143" stroke-width="1.2"/>
      <path d="M 10 77 L 10 85 L 18 85" fill="none" stroke="#D9A143" stroke-width="1.2"/>
      <path d="M 250 77 L 250 85 L 242 85" fill="none" stroke="#D9A143" stroke-width="1.2"/>

      <text x="130" y="26" text-anchor="middle" font-family="'Raleway', sans-serif" font-size="7.5" font-weight="700" fill="#7E4515" letter-spacing="1.5">KEPADA YTH. BAPAK/IBU/SAUDARA/I</text>
      <text x="130" y="52" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" font-weight="700" fill="#341A0B">Tamu Undangan</text>
      <text x="130" y="74" text-anchor="middle" font-family="'Raleway', sans-serif" font-size="7" fill="#8C5628" opacity="0.9">Tanpa mengurangi rasa hormat, kami mengundang Anda untuk hadir.</text>
    </g>

    <!-- Amber Gold Capsule Button -->
    <g transform="translate(81, 410)">
      <rect width="150" height="38" rx="19" fill="url(#amberGoldGrad)" filter="url(#sunsetGlow)"/>
      <text x="75" y="23" text-anchor="middle" font-family="'Raleway', sans-serif" font-size="9.5" font-weight="800" fill="#341A0B" letter-spacing="1.2">BUKA UNDANGAN</text>
    </g>
  </g>
</svg>
