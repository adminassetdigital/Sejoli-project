<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" width="360" height="610">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfbe7e"/>
      <stop offset="35%" stop-color="#fae3ad"/>
      <stop offset="70%" stop-color="#b38738"/>
      <stop offset="100%" stop-color="#dfbe7e"/>
    </linearGradient>
    <radialGradient id="emeraldBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0a3d30"/>
      <stop offset="50%" stop-color="#062c22"/>
      <stop offset="100%" stop-color="#031a14"/>
    </radialGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#dfbe7e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="360" height="610" fill="url(#emeraldBg)"/>

  <!-- Subtle Emerald Overlay Pattern Dots -->
  <g fill="#dfbe7e" opacity="0.08">
    <circle cx="20" cy="20" r="1"/><circle cx="60" cy="20" r="1"/><circle cx="100" cy="20" r="1"/><circle cx="140" cy="20" r="1"/><circle cx="180" cy="20" r="1"/><circle cx="220" cy="20" r="1"/><circle cx="260" cy="20" r="1"/><circle cx="300" cy="20" r="1"/><circle cx="340" cy="20" r="1"/>
    <circle cx="20" cy="60" r="1"/><circle cx="60" cy="60" r="1"/><circle cx="100" cy="60" r="1"/><circle cx="140" cy="60" r="1"/><circle cx="180" cy="60" r="1"/><circle cx="220" cy="60" r="1"/><circle cx="260" cy="60" r="1"/><circle cx="300" cy="60" r="1"/><circle cx="340" cy="60" r="1"/>
    <circle cx="20" cy="100" r="1"/><circle cx="60" cy="100" r="1"/><circle cx="100" cy="100" r="1"/><circle cx="140" cy="100" r="1"/><circle cx="180" cy="100" r="1"/><circle cx="220" cy="100" r="1"/><circle cx="260" cy="100" r="1"/><circle cx="300" cy="100" r="1"/><circle cx="340" cy="100" r="1"/>
  </g>

  <!-- Main Card Container -->
  <g transform="translate(24, 40)">
    <!-- Header -->
    <text x="156" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#eed18a" letter-spacing="3.5">WALIMATUL 'URSY</text>

    <!-- Couple Concentric Ring -->
    <g transform="translate(156, 115)">
      <!-- Outer Concentric Rotating Ring -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#fae3ad" stroke-width="0.75" opacity="0.4"/>
      <!-- Dashed Middle Ring -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="6 4"/>
      <!-- Inner Photo Frame -->
      <circle cx="0" cy="0" r="40" fill="#062c22" stroke="#ffffff" stroke-width="2" filter="url(#emeraldGlow)"/>
      <path d="M-15,10 C-15,-10 15,-10 15,10 Z" fill="#dfbe7e" opacity="0.8"/>
      <circle cx="0" cy="-6" r="10" fill="#fae3ad"/>
    </g>

    <!-- Couple Names & Script Ampersand -->
    <text x="156" y="215" text-anchor="middle" font-family="'Playfair Display', serif" font-size="28" font-weight="700" fill="#ffffff">
      Soren <tspan font-family="'Pinyon Script', cursive" font-size="26" fill="url(#goldGrad)">&amp;</tspan> Freya
    </text>

    <!-- Subtitle Date -->
    <text x="156" y="240" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" fill="#eed18a" letter-spacing="2">SABTU, 12 DESEMBER 2026</text>

    <!-- Recipient Box -->
    <g transform="translate(26, 275)">
      <rect width="260" height="95" rx="14" fill="#031a14" fill-opacity="0.8" stroke="url(#goldGrad)" stroke-width="0.8"/>
      <!-- Corner Accents -->
      <path d="M 10 18 L 10 10 L 18 10" fill="none" stroke="#dfbe7e" stroke-width="1"/>
      <path d="M 250 18 L 250 10 L 242 10" fill="none" stroke="#dfbe7e" stroke-width="1"/>
      <path d="M 10 77 L 10 85 L 18 85" fill="none" stroke="#dfbe7e" stroke-width="1"/>
      <path d="M 250 77 L 250 85 L 242 85" fill="none" stroke="#dfbe7e" stroke-width="1"/>

      <text x="130" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#eed18a" letter-spacing="1.5">KEPADA YTH. BAPAK/IBU/SAUDARA/I</text>
      <text x="130" y="52" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" font-weight="700" fill="#ffffff">Tamu Undangan</text>
      <text x="130" y="74" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#dfbe7e" opacity="0.8">Tanpa mengurangi rasa hormat, kami mengundang Anda untuk hadir.</text>
    </g>

    <!-- Gold Capsule Button -->
    <g transform="translate(81, 410)">
      <rect width="150" height="38" rx="19" fill="url(#goldGrad)" filter="url(#emeraldGlow)"/>
      <text x="75" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#031a14" letter-spacing="1.2">BUKA UNDANGAN</text>
    </g>
  </g>
</svg>
